# TEMPORARY: proves the ff-renovate App can mint release.yml's token
# permission set. Read-only API calls only. Removed in the next commit.
name: zz app-token check
on:
  pull_request:
    branches: [master]
permissions: {}
jobs:
  mint:
    name: zz mint release token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint (release.yml set)
        id: t
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Read-only calls
        env:
          GH_TOKEN: ${{ steps.t.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name'
          gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq '.sha'
